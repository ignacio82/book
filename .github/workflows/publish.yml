on:
  push:
    branches: master
  pull_request:
    branches: master

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No _freeze cache on purpose. Every chapter's _freeze is committed to
      # the repo, so the checkout already carries the correct, matching
      # results. actions/cache extracts its archive ON TOP of the checkout,
      # so a restore-key (inexact) hit would overwrite those freshly
      # committed freezes with stale ones from an older run, breaking the
      # hash match and forcing Quarto to re-execute the chapter. That is
      # exactly what made strength.qmd re-render for 1h39m in run
      # 33928690616 despite its freeze being committed alongside it.

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libv8-dev libboost-all-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Must match the Quarto in the Docker image that generates
          # _freeze locally. Quarto hashes differ across versions, so a
          # mismatch silently invalidates every committed freeze and CI
          # re-executes the whole book.
          version: 1.9.38

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
        
      # NOTE: everything under extra-packages is a literal package list, not
      # YAML structure -- a '#' line in there is handed to pak as a package
      # ref and the step dies. Explanations belong out here.
      #
      # shinylive is pinned: the vendored Quarto extension
      # (_extensions/quarto-ext/shinylive, v0.2.0) drives it through the
      # PRIVATE entry point shinylive:::quarto_ext(), which no compatibility
      # promise covers, so an unpinned upgrade can break the publish on a
      # commit that has nothing to do with Shiny.
      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::purrr
            any::tidyverse
            any::broom
            any::scales
            any::patchwork
            any::zoo
            any::ggiraph
            any::ggpubr
            any::stochtree
            any::CausalImpact
            any::bsynth
            any::rstan
            any::bayesplot
            any::posterior
            any::vizdraws
            any::glossary
            any::furrr
            any::tictoc
            any::glue
            any::shinydashboard
            shinylive@0.5.0
            any::remotes
            any::MatchIt
            any::coda
            any::rpart
            any::rpart.plot
            any::shiny
            any::shinybusy
            any::arm
            any::future
            any::lubridate
            any::brms
            google/imt
            google/biva
            ignacio82/longbet@v0.7.2

      # The shinylive filter shells out to Rscript mid-render and, if the
      # WebAssembly bundle is not already on disk, downloads it from the
      # network right then. That is a live dependency inside the publish: run
      # 33981765601 died on it with `pandoc.pipe.error {command: "Rscript",
      # error_code: 1, output: ""}`, reported by the filter as "Perhaps you
      # need to install / update the 'shinylive' R package", which it was not.
      # Fetch the bundle up front instead, so a network failure surfaces here
      # in seconds with a real message rather than twenty minutes into a
      # render as a misleading one.
      - name: Shinylive assets version
        id: shinylive
        run: echo "version=$(Rscript -e 'cat(as.character(shinylive::assets_version()))')" >> "$GITHUB_OUTPUT"

      # Safe to cache, unlike _freeze: these are immutable, version-addressed
      # downloads restored into a directory nothing else writes, and the key
      # is exact with no restore-keys, so there is no stale-hit path.
      - name: Cache shinylive assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/shinylive
          key: shinylive-assets-${{ steps.shinylive.outputs.version }}

      - name: Ensure shinylive assets
        run: |
          for attempt in 1 2 3; do
            if Rscript -e 'shinylive::assets_ensure()'; then exit 0; fi
            echo "shinylive asset download failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not fetch shinylive assets after 3 attempts"
          exit 1

      # Known, unfixed: the script Quarto runs for each shinylive block comes
      # from that asset bundle, and its line 5 is
      #   import { readLines } from "https://deno.land/std/io/mod.ts";
      # with no version. Every render therefore re-resolves "latest" against
      # deno.land, which is a second network dependency and a second way an
      # unrelated upstream release could break this build. Caching DENO_DIR
      # does not help -- an unpinned specifier is revalidated over the network
      # regardless -- and the file lives inside a downloaded cache directory,
      # so patching it would have to be redone on every refresh. Left alone
      # deliberately: it has not failed, and a half-measure here would be
      # harder to reason about than the exposure.
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
