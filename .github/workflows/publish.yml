on:
  push:
    branches: master
  pull_request:
    branches: master

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No _freeze cache on purpose. Every chapter's _freeze is committed to
      # the repo, so the checkout already carries the correct, matching
      # results. actions/cache extracts its archive ON TOP of the checkout,
      # so a restore-key (inexact) hit would overwrite those freshly
      # committed freezes with stale ones from an older run, breaking the
      # hash match and forcing Quarto to re-execute the chapter. That is
      # exactly what made strength.qmd re-render for 1h39m in run
      # 33928690616 despite its freeze being committed alongside it.

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libv8-dev libboost-all-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Must match the Quarto in the Docker image that generates
          # _freeze locally. Quarto hashes differ across versions, so a
          # mismatch silently invalidates every committed freeze and CI
          # re-executes the whole book.
          version: 1.9.38

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
        
      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::purrr
            any::tidyverse
            any::broom
            any::scales
            any::patchwork
            any::zoo
            any::ggiraph
            any::ggpubr
            any::stochtree
            any::CausalImpact
            any::bsynth
            any::rstan
            any::bayesplot
            any::posterior
            any::vizdraws
            any::glossary
            any::furrr
            any::tictoc
            any::glue
            any::shinydashboard
            any::shinylive
            any::remotes
            any::MatchIt
            any::coda
            any::rpart
            any::rpart.plot
            any::shiny
            any::shinybusy
            any::arm
            any::future
            any::lubridate
            any::brms
            google/imt
            google/biva
            google/longbet

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
